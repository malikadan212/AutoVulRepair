# Docker Compose V2 - Enhanced Architecture
# Includes Redis, Celery workers, and improved database setup

services:
  # Main application
  app:
    build: 
      context: .
      dockerfile: Dockerfile
    image: autovulrepair:latest  # Tag the built image for reuse
    user: root  # Run as root to access Docker socket
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://autovulrepair:${POSTGRES_PASSWORD}@postgres:5432/autovulrepair
      - REDIS_URL=redis://redis:6379/0
      - MIGRATION_MODE=dual
      - ENABLE_V2_API=true
      - ENABLE_BACKGROUND_JOBS=true
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:-dev-secret-key}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GITHUB_APP_ID=${GITHUB_APP_ID}
      - GITHUB_APP_NAME=${GITHUB_APP_NAME:-autovulrepair-dev}
      - GITHUB_APP_PRIVATE_KEY=${GITHUB_APP_PRIVATE_KEY}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SCANS_DIR=/app/scans
      - PYTHONUNBUFFERED=1
      - FLASK_ENV=development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./scans:/app/scans  # Temporary during migration
      - ./logs:/app/logs
      - ./templates:/app/templates  # Mount templates for live updates
      - /var/run/docker.sock:/var/run/docker.sock  # For Docker-based analysis tools
    networks:
      - autovulrepair-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL database
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=autovulrepair
      - POSTGRES_USER=autovulrepair
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    networks:
      - autovulrepair-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autovulrepair -d autovulrepair"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100

  # Redis for caching and job queue
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - autovulrepair-network
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Celery worker for scan processing
  celery-worker-scan:
    image: autovulrepair:latest  # Reuse the built image
    entrypoint: ["python", "start_correct_worker.py"]
    user: root  # Run as root to access Docker socket
    environment:
      - DATABASE_URL=postgresql://autovulrepair:${POSTGRES_PASSWORD}@postgres:5432/autovulrepair
      - REDIS_URL=redis://redis:6379/0
      - CELERY_WORKER=true
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:-dev-secret-key}
      - WORKER_TYPE=scan
      - PYTHONUNBUFFERED=1
    depends_on:
      app:  # Depend on app to ensure image is built first
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./scans:/app/scans  # Temporary during migration
      - ./logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock  # For Docker-based analysis tools
    networks:
      - autovulrepair-network
    restart: unless-stopped
    deploy:
      replicas: 2
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]  # Simple health check
      interval: 30s
      timeout: 10s
      retries: 3

  # Celery worker for fuzzing
  celery-worker-fuzz:
    image: autovulrepair:latest  # Reuse the built image
    entrypoint: ["python", "start_correct_worker.py"]
    user: root  # Run as root to access Docker socket
    environment:
      - DATABASE_URL=postgresql://autovulrepair:${POSTGRES_PASSWORD}@postgres:5432/autovulrepair
      - REDIS_URL=redis://redis:6379/0
      - CELERY_WORKER=true
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:-dev-secret-key}
      - WORKER_TYPE=fuzzing
      - PYTHONUNBUFFERED=1
    depends_on:
      app:  # Depend on app to ensure image is built first
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./scans:/app/scans  # Temporary during migration
      - ./logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock  # For Docker-based analysis tools
    networks:
      - autovulrepair-network
    restart: unless-stopped
    deploy:
      replicas: 1
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]  # Simple health check
      interval: 30s
      timeout: 10s
      retries: 3

  # Celery beat scheduler
  celery-beat:
    image: autovulrepair:latest  # Reuse the built image
    entrypoint: []
    command: celery -A src.workers.job_worker beat --loglevel=info --schedule=/tmp/celerybeat-schedule --pidfile=/tmp/celerybeat.pid
    environment:
      - DATABASE_URL=postgresql://autovulrepair:${POSTGRES_PASSWORD}@postgres:5432/autovulrepair
      - REDIS_URL=redis://redis:6379/0
      - CELERY_WORKER=true
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:-dev-secret-key}
      - PYTHONUNBUFFERED=1
    depends_on:
      app:  # Depend on app to ensure image is built first
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - celery_beat_data:/tmp
    networks:
      - autovulrepair-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]  # Simple health check
      interval: 60s
      timeout: 10s
      retries: 3

  # Celery flower for monitoring (optional)
  celery-flower:
    image: autovulrepair:latest  # Reuse the built image
    command: python celery_flower.py
    ports:
      - "5555:5555"
    environment:
      - DATABASE_URL=postgresql://autovulrepair:${POSTGRES_PASSWORD}@postgres:5432/autovulrepair
      - REDIS_URL=redis://redis:6379/0
      - CELERY_WORKER=true
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:-dev-secret-key}
      - PYTHONUNBUFFERED=1
    depends_on:
      app:  # Depend on app to ensure image is built first
        condition: service_started
      redis:
        condition: service_started
    networks:
      - autovulrepair-network
    restart: unless-stopped
    profiles:
      - monitoring

  # Nginx reverse proxy (optional)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - autovulrepair-network
    restart: unless-stopped
    profiles:
      - production

  # Prometheus monitoring (optional)
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - autovulrepair-network
    restart: unless-stopped
    profiles:
      - monitoring

  # Grafana dashboards (optional)
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    networks:
      - autovulrepair-network
    restart: unless-stopped
    profiles:
      - monitoring

  # pgAdmin for database visualization
  pgadmin:
    image: dpage/pgadmin4:latest
    ports:
      - "5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@autovulrepair.local
      - PGADMIN_DEFAULT_PASSWORD=admin
      - PGADMIN_CONFIG_SERVER_MODE=False
      - PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED=False
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - autovulrepair-network
    restart: unless-stopped
    profiles:
      - database

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  celery_beat_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  autovulrepair-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16